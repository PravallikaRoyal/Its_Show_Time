<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1600" height="400" viewBox="0 0 1600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="pinkGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2d55"/>
      <stop offset="100%" stop-color="#ff004c"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1600" height="400" fill="black"/>

  <!-- Curved lines -->
  <path d="M0,60 Q800,10 1600,60" stroke="#111111" stroke-width="22" fill="none"/>
  <path d="M0,310 Q800,360 1600,310" stroke="#111111" stroke-width="22" fill="none"/>

  <!-- Main Text -->
  <text x="220" y="230"
        font-family="Arial, Helvetica, sans-serif"
        font-size="170"
        font-weight="bold"
        fill="url(#pinkGlow)"
        filter="url(#glow)">
        It's Show Time
  </text>

  <!-- Left Circle -->
  <circle cx="95" cy="200" r="32" stroke="#aa1133" stroke-width="2" fill="none"/>
  <circle cx="95" cy="200" r="12" stroke="#aa1133" stroke-width="2" fill="none"/>

  <!-- Right Icon -->
  <rect x="1380" y="175" width="60" height="45" rx="3"
        stroke="#aa1133" stroke-width="2" fill="none"/>
  <line x1="1380" y1="175" x2="1440" y2="220"
        stroke="#aa1133" stroke-width="2"/>

  <!-- Bottom Line -->
  <line x1="500" y1="312" x2="1150" y2="312"
        stroke="#d4af37" stroke-width="2"/>

  <!-- Decorative dots -->
  <circle cx="500" cy="312" r="3" fill="#d4af37"/>
  <circle cx="1115" cy="312" r="3" fill="#d4af37"/>

  <!-- Subtitle -->
  <text x="540" y="345"
        font-family="Arial, Helvetica, sans-serif"
        font-size="26"
        letter-spacing="8"
        fill="#d4af37">
        A Cinematic Presentation
  </text>
</svg>
